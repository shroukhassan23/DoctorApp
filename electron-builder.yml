# electron-builder.yml - Platform-specific resources
appId: com.doctorapp.desktop
productName: "Doctor App"
copyright: "Copyright © 2025 Doctor App"
directories:
  output: "dist-installers"
  buildResources: "build"

files:
  - "app_dist/**/*"
  - "electron.cjs"
  - "preload.js"
  - "src/utils/**/*"
  - "dump.sql"
  - "initDb.cjs"
  - "patient.cjs"
  - "visit.cjs" 
  - "reports.cjs"
  - "!package.json"

extraFiles:
  - from: "node_modules/mysql2"
    to: "app/node_modules/mysql2"
    filter: ["**/*"]
  - from: "node_modules/express"
    to: "app/node_modules/express"
    filter: ["**/*"]
  - from: "node_modules/cors"
    to: "app/node_modules/cors"
    filter: ["**/*"]
  - from: "node_modules/multer"
    to: "app/node_modules/multer"
    filter: ["**/*"]
  - from: "node_modules/node-machine-id"
    to: "app/node_modules/node-machine-id"
    filter: ["**/*"]

extraMetadata:
  name: "doctor-app-desktop"
  version: "1.0.0"
  main: "electron.cjs"
  type: "commonjs"
  dependencies: {}

# Windows configuration
win:
  target:
    - target: "dir"
      arch: ["x64"]
  icon: "build/icon.ico"
  extraResources:
    - from: "mysql-resources/mysql-windows"
      to: "mysql-windows"
      filter: ["**/*"]
    - from: "mySql/patient.cjs"
      to: "Resources/app.asar.unpacked/patient.cjs" 
    - from: "mySql/visit.cjs"
      to: "Resources/app.asar.unpacked/visit.cjs"
    - from: "mySql/reports.cjs"
      to: "Resources/app.asar.unpacked/reports.cjs"
# macOS configuration  
mac:
  target:
    - target: "dir"
      arch: ["arm64"]
  icon: "build/icon.icns"
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  extraResources:
    - from: "mysql-resources/mysql-macos"
      to: "mysql-macos"
      filter: ["**/*"]

asar: false
compression: "normal"