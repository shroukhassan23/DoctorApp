# electron-builder.yml - Fixed configuration for better-sqlite3 with proper rebuild
appId: com.doctorapp.desktop
productName: "Doctor App"
copyright: "Copyright © 2025 Doctor App"
directories:
  output: "dist-installers"
  buildResources: "build"

files:
  - "app_dist/**/*"
  - "electron.cjs"
  - "preload.js"
  - "src/utils/**/*"
  - "dump.sql"
  - "initDb.cjs"
  - "!package.json"

extraFiles:
  # These files are bundled WITH the Electron app (for app functionality)
  - from: "src/utils/fileLog.cjs"  
    to: "app/fileLog.cjs"
  - from: "src/utils/sqliteManager.cjs"
    to: "app/sqliteManager.cjs"
  - from: "src/utils/backendManager.cjs"
    to: "app/backendManager.cjs"
  - from: "src/utils/configManager.cjs"
    to: "app/configManager.cjs"
  - from: "src/utils/licenseManager.cjs"
    to: "app/licenseManager.cjs"
  - from: "src/utils/logger.cjs"
    to: "app/logger.cjs"

extraMetadata:
  name: "doctor-app-desktop"
  version: "1.0.0"
  main: "electron.cjs"
  type: "commonjs"
  dependencies: {}

# Windows configuration
win:
  target:
    - target: "dir"
      arch: ["x64"]
  icon: "build/icon.ico"
  extraResources:
    # Service files for Windows services (separate from Electron app)
    - from: "mySql/patient.cjs"
      to: "patient.cjs"
    - from: "mySql/visit.cjs"
      to: "visit.cjs"
    - from: "mySql/reports.cjs"
      to: "reports.cjs"
    
    # Database and initialization
    - from: "initDb.cjs"          
      to: "initDb.cjs"            
    - from: "dump.sql"
      to: "app/src/utils/dump.sql"
    
    # Utility files for services
    - from: "src/utils/sqliteManager.cjs"
      to: "sqliteManager.cjs"
    - from: "src/utils/fileLog.cjs"
      to: "fileLog.cjs"
    
    # Windows service management
    - from: "tools/nssm/nssm.exe"
      to: "nssm.exe"
    - from: "scripts/install-services.cjs"
      to: "install-services.cjs"
    - from: "scripts/uninstall-services.cjs"
      to: "uninstall-services.cjs"
    
    # Node.js executable - MUST match the version you're building with
    - from: "C:/Program Files/nodejs/node.exe"
      to: "node.exe"
      filter: ["node.exe"]
    
    # CRITICAL: Pre-built better-sqlite3 for Node.js v20
    - from: "better-sqlite3-prebuilt"
      to: "better-sqlite3-prebuilt"
      filter: ["**/*"]

# macOS configuration  
mac:
  target:
    - target: "dir"
      arch: ["arm64"]
  icon: "build/icon.icns"
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  extraResources:
    - from: "dump.sql"
      to: "dump.sql"
    - from: "better-sqlite3-prebuilt"
      to: "better-sqlite3-prebuilt"
      filter: ["**/*"]

# CRITICAL: Build scripts to prepare better-sqlite3
beforeBuild: 
  - mkdir -p better-sqlite3-prebuilt
  - npm install better-sqlite3 --target=20.19.3 --target_platform=win32 --target_arch=x64 --build-from-source
  - cp -r node_modules/better-sqlite3 better-sqlite3-prebuilt/

asar: false
compression: "normal"
includeSubNodeModules: false
nodeGypRebuild: true