# electron-builder.yml - Fixed configuration for SQLite and fileLog
appId: com.doctorapp.desktop
productName: "Doctor App"
copyright: "Copyright © 2025 Doctor App"
directories:
  output: "dist-installers"
  buildResources: "build"

files:
  - "app_dist/**/*"
  - "electron.cjs"
  - "preload.js"
  - "src/utils/**/*"
  - "dump.sql"
  - "initDb.cjs"
  - "!package.json"
  # Remove service files from main app bundle - they go to extraResources instead

extraFiles:
  # These files are bundled WITH the Electron app (for app functionality)
  - from: "src/utils/fileLog.cjs"  
    to: "app/fileLog.cjs"
  - from: "src/utils/sqliteManager.cjs"
    to: "app/sqliteManager.cjs"
  - from: "src/utils/backendManager.cjs"
    to: "app/backendManager.cjs"
  - from: "src/utils/configManager.cjs"
    to: "app/configManager.cjs"
  - from: "src/utils/licenseManager.cjs"
    to: "app/licenseManager.cjs"
  - from: "src/utils/logger.cjs"
    to: "app/logger.cjs"
  # Required Node.js modules for services
  - from: "node_modules/sqlite3"
    to: "app/node_modules/sqlite3"
    filter: ["**/*"]
  - from: "node_modules/express"
    to: "app/node_modules/express"
    filter: ["**/*"]
  - from: "node_modules/cors"
    to: "app/node_modules/cors"
    filter: ["**/*"]
  - from: "node_modules/multer"
    to: "app/node_modules/multer"
    filter: ["**/*"]
  - from: "node_modules/node-machine-id"
    to: "app/node_modules/node-machine-id"
    filter: ["**/*"]
  - from: "node_modules/sql.js"
    to: "app/node_modules/sql.js"
    filter: ["**/*"]

extraMetadata:
  name: "doctor-app-desktop"
  version: "1.0.0"
  main: "electron.cjs"
  type: "commonjs"
  dependencies: {}

# Windows configuration
win:
  target:
    - target: "dir"
      arch: ["x64"]
  icon: "build/icon.ico"
  extraResources:
    # Service files for Windows services (separate from Electron app)
    - from: "mySql/patient.cjs"
      to: "patient.cjs"
    - from: "mySql/visit.cjs"
      to: "visit.cjs"
    - from: "mySql/reports.cjs"
      to: "reports.cjs"
    
    # Database and initialization
    - from: "initDb.cjs"          
      to: "initDb.cjs"            
    - from: "dump.sql"
      to: "dump.sql"
    
    # Utility files for services
    - from: "src/utils/sqliteManager.cjs"
      to: "sqliteManager.cjs"
    - from: "src/utils/fileLog.cjs"
      to: "fileLog.cjs"
    
    # Windows service management - Fixed NSSM path
    - from: "tools/nssm/nssm.exe"
      to: "nssm.exe"
    - from: "scripts/install-services.cjs"
      to: "install-services.cjs"
    - from: "scripts/uninstall-services.cjs"
      to: "uninstall-services.cjs"
    
    # Node.js executable (try to bundle it, but make it optional)
    - from: "C:/Program Files/nodejs/node.exe"
      to: "node.exe"
      filter: ["node.exe"]

# macOS configuration  
mac:
  target:
    - target: "dir"
      arch: ["arm64"]
  icon: "build/icon.icns"
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  extraResources:
    # macOS doesn't need Windows services, just the schema
    - from: "dump.sql"
      to: "dump.sql"

asar: false
compression: "normal"