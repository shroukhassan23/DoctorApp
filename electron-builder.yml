# electron-builder.yml - Fixed with proper node_modules location
appId: com.doctorapp.desktop
productName: "Doctor App"
copyright: "Copyright © 2025 Doctor App"
directories:
  output: "dist-installers"
  buildResources: "build"

files:
  - "app_dist/**/*"
  - "electron.cjs"
  - "preload.js"
  - "src/utils/**/*"
  - "dump.sql"
  - "initDb.cjs"
  - "patient.cjs"
  - "visit.cjs" 
  - "reports.cjs"
  - "!package.json"

# Put node_modules in the app folder this time
extraFiles:
  - from: "node_modules/mysql2"
    to: "app/node_modules/mysql2"
    filter: ["**/*"]
  - from: "node_modules/express"
    to: "app/node_modules/express"
    filter: ["**/*"]
  - from: "node_modules/cors"
    to: "app/node_modules/cors"
    filter: ["**/*"]
  - from: "node_modules/multer"
    to: "app/node_modules/multer"
    filter: ["**/*"]
  - from: "node_modules/node-machine-id"
    to: "app/node_modules/node-machine-id"
    filter: ["**/*"]

extraMetadata:
  name: "doctor-app-desktop"
  version: "1.0.0"
  main: "electron.cjs"
  type: "commonjs"
  dependencies: {}

extraResources:
  - from: "mysql-resources/mysql-macos"
    to: "mysql-macos"
    filter: ["**/*"]

mac:
  target:
    - target: "dir"
      arch: ["arm64"]
  icon: "build/icon.icns"
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false

asar: false
compression: "normal"