# electron-builder.yml - Fixed configuration
appId: com.doctorapp.desktop
productName: "Doctor App"
copyright: "Copyright © 2025 Doctor App"
directories:
  output: "dist-installers"
  buildResources: "build"

files:
  - "app_dist/**/*"
  - "electron.cjs"
  - "preload.js"
  - "src/utils/**/*"
  - "dump.sql"
  - "initDb.cjs"
  - "!package.json"
  - "node_modules/file-uri-to-path/**/*"

extraFiles:
  # These files are bundled WITH the Electron app (for app functionality)
  - from: "src/utils/fileLog.cjs"  
    to: "app/fileLog.cjs"
  - from: "src/utils/sqliteManager.cjs"
    to: "app/sqliteManager.cjs"
  - from: "src/utils/backendManager.cjs"
    to: "app/backendManager.cjs"
  - from: "src/utils/configManager.cjs"
    to: "app/configManager.cjs"
  - from: "src/utils/licenseManager.cjs"
    to: "app/licenseManager.cjs"
  - from: "src/utils/logger.cjs"
    to: "app/logger.cjs"

extraMetadata:
  name: "doctor-app-desktop"
  version: "1.0.0"
  main: "electron.cjs"
  type: "commonjs"
  dependencies: {}

# Windows configuration
win:
  target:
    - target: "dir"
      arch: ["x64"]
  icon: "build/icon.ico"
  extraResources:
    # Database and initialization
    - from: "initDb.cjs"          
      to: "initDb.cjs"            
    - from: "dump.sql"
      to: "app/src/utils/dump.sql"
    - from: "dump.sql"
      to: "dump.sql"
    - from: "src/utils/backendManager.cjs"
      to: "backendManager.cjs"
    - from: "src/utils/configManager.cjs"
      to: "configManager.cjs"
    - from: "src/utils/licenseManager.cjs"
      to: "licenseManager.cjs"
    - from: "src/utils/logger.cjs"
      to: "logger.cjs"
    
    - from: "mySql/combined-service.cjs"
      to: "combined-service.cjs"
    
    # Utility files for services
    - from: "src/utils/sqliteManager.cjs"
      to: "sqliteManager.cjs"
    - from: "src/utils/fileLog.cjs"
      to: "fileLog.cjs"
    
    # Windows service management
    - from: "tools/nssm/nssm.exe"
      to: "nssm.exe"
    - from: "scripts/install-services.cjs"
      to: "install-services.cjs"
    - from: "scripts/uninstall-services.cjs"
      to: "uninstall-services.cjs"
    
    # Node.js executable
    - from: "C:/Program Files/nodejs/node.exe"
      to: "node.exe"
      filter: ["node.exe"]
    
    # REMOVED: All better-sqlite3 and bindings references

# macOS configuration  
mac:
  target:
    - target: "dir"
      arch: ["arm64"]
  icon: "build/icon.icns"
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  extraResources:
    - from: "dump.sql"
      to: "dump.sql"

asar: false
compression: "normal"
includeSubNodeModules: false
nodeGypRebuild: false

# REMOVED: beforeBuild - this was causing the error