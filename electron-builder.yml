# electron-builder.yml - Platform-specific resources
appId: com.doctorapp.desktop
productName: "Doctor App"
copyright: "Copyright © 2025 Doctor App"
directories:
  output: "dist-installers"
  buildResources: "build"

files:
  - "app_dist/**/*"
  - "electron.cjs"
  - "preload.js"
  - "src/utils/**/*"
  - "initDb.cjs"
  - "mySql/patient.cjs"    # Update path if they're in mySql folder
  - "mySql/visit.cjs"      # Update path if they're in mySql folder
  - "mySql/reports.cjs"    # Update path if they're in mySql folder
  - "!package.json"

extraFiles:
  - from: "mySql/patient.cjs"
    to: "app/patient.cjs"
  - from: "mySql/visit.cjs" 
    to: "app/visit.cjs"
  - from: "mySql/reports.cjs"
    to: "app/reports.cjs"
  - from: "node_modules/better-sqlite3"
    to: "app/node_modules/better-sqlite3"
    filter: ["**/*"]
  - from: "node_modules/express"
    to: "app/node_modules/express"
    filter: ["**/*"]
  - from: "node_modules/cors"
    to: "app/node_modules/cors"
    filter: ["**/*"]
  - from: "node_modules/multer"
    to: "app/node_modules/multer"
    filter: ["**/*"]
  - from: "node_modules/node-machine-id"
    to: "app/node_modules/node-machine-id"
    filter: ["**/*"]

extraMetadata:
  name: "doctor-app-desktop"
  version: "1.0.0"
  main: "electron.cjs"
  type: "commonjs"
  dependencies: {}

# Windows configuration
win:
  target:
    - target: "dir"
      arch: ["x64"]
  icon: "build/icon.ico"
  extraResources:
    - from: "mySql/patient.cjs"
      to: "patient.cjs"
    - from: "mySql/visit.cjs"
      to: "visit.cjs"
    - from: "mySql/reports.cjs"
      to: "reports.cjs"
    - from: "dump.sql"
      to: "dump.sql"

# macOS configuration  
mac:
  target:
    - target: "dir"
      arch: ["arm64"]
  icon: "build/icon.icns"
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  extraResources:
    # Remove MySQL:
    # - from: "mysql-resources/mysql-macos"
    #   to: "mysql-macos"
    #   filter: ["**/*"]
    
    # Keep schema file:
    - from: "dump.sql"
      to: "dump.sql"

asar: false
compression: "normal"